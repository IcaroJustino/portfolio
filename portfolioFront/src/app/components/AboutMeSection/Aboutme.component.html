<section
	id="about"
	class="bg-bg-dark py-16 sm:py-20 rounded-2xl shadow-lg shadow-black/20 border border-border/20 mt-8"
>
	<div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">

		<!-- Header with decorative monogram -->
		<header class="text-center mb-14">
			<div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-2xl border border-border/40 bg-bg-light/20 shadow-lg">
				<span class="text-3xl font-bold bg-linear-to-r from-primary to-info bg-clip-text text-transparent select-none">IJ</span>
			</div>
			<h2 class="text-3xl font-semibold tracking-wide sm:text-4xl">{{ texts().title }}</h2>
			<p class="mx-auto mt-3 max-w-2xl text-sm leading-relaxed text-text-muted sm:text-base">
				{{ texts().aboutmeText }}
			</p>
		</header>

		<!-- Two-column cards: Journey + Approach -->
		<div class="grid gap-6 md:grid-cols-2">

			<!-- My Journey -->
			<div class="group relative rounded-2xl border border-border/40 bg-bg-light/10 p-6 sm:p-8 transition-all duration-300 hover:border-primary/30 hover:bg-bg-light/20">
				<div class="mb-4 flex items-center gap-3">
					<div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/15 text-primary ring-1 ring-inset ring-primary/25">
						<lucide-icon name="compass" class="h-5 w-5"></lucide-icon>
					</div>
					<h3 class="text-lg font-semibold text-text">{{ texts().journeyTitle }}</h3>
				</div>
				<p class="text-sm leading-relaxed text-text-muted sm:text-base">
					{{ texts().myJourneyText }}
				</p>
			</div>

			<!-- My Approach -->
			<div class="group relative rounded-2xl border border-border/40 bg-bg-light/10 p-6 sm:p-8 transition-all duration-300 hover:border-primary/30 hover:bg-bg-light/20">
				<div class="mb-4 flex items-center gap-3">
					<div class="flex h-10 w-10 items-center justify-center rounded-xl bg-info/15 text-info ring-1 ring-inset ring-info/25">
						<lucide-icon name="lightbulb" class="h-5 w-5"></lucide-icon>
					</div>
					<h3 class="text-lg font-semibold text-text">{{ texts().approachTitle }}</h3>
				</div>
				<p class="text-sm leading-relaxed text-text-muted sm:text-base">
					{{ texts().myApproachText }}
				</p>
			</div>

		</div>

		<!-- Stats row -->
		<div class="mt-10 grid grid-cols-3 gap-4 sm:gap-6">
			<div
				*ngFor="let card of titleCards"
				class="group flex flex-col items-center rounded-2xl border border-border/30 bg-bg-light/10 px-4 py-6 text-center transition-all duration-300 hover:border-primary/30 hover:bg-bg-light/20"
			>
				<div
					class="flex h-12 w-12 items-center justify-center rounded-full border border-border/40 bg-bg-dark/60 text-primary transition-colors duration-300 group-hover:border-primary/40 group-hover:bg-primary/10"
				>
					<ng-container [ngSwitch]="card.icon">
						<lucide-icon *ngSwitchCase="'medal'" name="medal" class="h-5 w-5"></lucide-icon>
						<lucide-icon *ngSwitchCase="'briefcase'" name="briefcase" class="h-5 w-5"></lucide-icon>
						<lucide-icon *ngSwitchCase="'code'" name="code" class="h-5 w-5"></lucide-icon>
						<lucide-icon *ngSwitchDefault name="circle-dot" class="h-5 w-5"></lucide-icon>
					</ng-container>
				</div>
				<div class="mt-3 text-2xl font-bold text-text sm:text-3xl">{{ card.displayCount }}</div>
				<div class="mt-1 text-xs text-text-muted sm:text-sm">{{ texts().stats[card.descriptionKey] }}</div>
			</div>
		</div>



	</div>
</section>
