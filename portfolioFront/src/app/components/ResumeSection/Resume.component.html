<section id="resume" class="relative isolate overflow-hidden bg-bg-dark py-16 sm:py-20 rounded-2xl shadow-lg shadow-black/20 border border-border/20 mt-8">

  
  <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
    <header class="text-center mb-12">
      <h2 class="text-3xl font-semibold tracking-wide text-text sm:text-4xl">{{ texts().title }}</h2>
      <p class="mx-auto mt-3 max-w-2xl text-sm leading-relaxed text-text-muted sm:text-base">
        {{ texts().subtitle }}
      </p>
    </header>

    <!-- Controls Card -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-6 rounded-2xl border border-border/80 bg-bg-light/40 p-6 shadow-[0_8px_30px_rgb(0,0,0,0.12)] backdrop-blur-sm transition mb-8">
      
      <div class="flex items-center gap-4 self-start md:self-auto">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary/20 text-primary ring-1 ring-inset ring-primary/30">
          <lucide-icon name="file-text" class="h-6 w-6"></lucide-icon>
        </div>
        <div>
          <h3 class="text-lg font-bold text-text">{{ texts().name }}</h3>
          <p class="text-sm text-text-muted">{{ texts().role }}</p>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto shrink-0">
        <!-- Preview toggle button hidden on mobile -->
        <button 
          (click)="togglePreview()"
          class="hidden md:inline-flex w-full sm:w-auto whitespace-nowrap items-center justify-center gap-2 rounded-lg bg-primary px-5 py-2.5 text-sm font-semibold text-bg-dark transition hover:bg-primary/90"
        >
          <lucide-icon [name]="showPreview ? 'eye-off' : 'eye'" class="h-4 w-4"></lucide-icon>
          {{ showPreview ? texts().hideBtn : texts().showBtn }}
        </button>
        
        <a 
          [href]="texts().pdfFile" 
          download="Icaro_Miranda_Resume.pdf"
          class="w-full sm:w-auto whitespace-nowrap inline-flex items-center justify-center gap-2 rounded-lg border border-border/80 bg-bg-dark/50 px-5 py-2.5 text-sm font-semibold text-text transition hover:bg-bg-dark hover:border-primary/50"
        >
          <lucide-icon name="download" class="h-4 w-4"></lucide-icon>
          {{ texts().downloadBtn }}
        </a>

        <a 
          [href]="texts().pdfFile" 
          target="_blank"
          class="w-full sm:w-auto whitespace-nowrap inline-flex items-center justify-center gap-2 rounded-lg border border-border/80 bg-bg-dark/50 px-5 py-2.5 text-sm font-semibold text-text transition hover:bg-bg-dark hover:border-primary/50"
        >
          <lucide-icon name="external-link" class="h-4 w-4"></lucide-icon>
          {{ texts().openTabBtn }}
        </a>
      </div>
    </div>

    <!-- PDF Preview Pane (Hidden on mobile) -->
    <div *ngIf="showPreview" class="hidden md:block overflow-hidden rounded-2xl border border-border/80 bg-bg-light/20 shadow-xl backdrop-blur-sm transition-all duration-500">
      <div class="flex items-center justify-between border-b border-border/80 bg-bg-light/40 px-4 py-3">
        <div class="flex items-center gap-2 text-sm font-medium text-text">
          <span>{{ texts().previewTitle }}</span>
        </div>
        <span class="text-xs text-text-muted hidden sm:inline">{{ texts().previewHint }}</span>
      </div>
      
      <div class="aspect-[1/1.4] w-full bg-[#323639] sm:h-[800px] sm:aspect-auto">
        <object 
          [data]="safeResumeUrl()" 
          type="application/pdf"
          width="100%" 
          height="100%" 
          class="border-0"
          title="Pré-visualização do Currículo PDF">
        </object>
      </div>
    </div>
    
  </div>
</section>
