<section id="experience"
  class="relative isolate overflow-hidden bg-bg-dark py-16 sm:py-20 rounded-2xl shadow-lg shadow-black/20 border border-border/20 mt-8">

  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-10">
    <header class="text-center">
      <h3 class="text-[0.65rem] font-bold uppercase tracking-[0.2em] text-primary/80 mb-3">{{ texts().headerOverline }}</h3>
      <h2 class="text-3xl font-extrabold tracking-tight text-text sm:text-5xl">
        {{ texts().headerTitle }} <span class="text-primary">{{ texts().headerTitleHighlight }}</span>
      </h2>
      <p class="mx-auto mt-4 max-w-2xl text-sm leading-relaxed text-text-muted sm:text-base">
        {{ texts().headerDescription }}
      </p>
    </header>

    <div class="relative mt-16 sm:mt-20 max-w-4xl mx-auto">
      <!-- Universal spine on the left (thicker) -->
      <div class="absolute left-8 md:left-12 top-0 h-full w-1 md:w-1.5 -translate-x-1/2 rounded-full bg-[linear-gradient(180deg,transparent,rgba(103,191,228,0.25),rgba(103,191,228,0.25),transparent)]"></div>

      <div class="space-y-10 sm:space-y-14">
        <ng-container *ngFor="let experience of experiences(); let i = index">
          <div #experienceCard class="relative flex items-center justify-end w-full opacity-0 translate-x-12 transition-all duration-700 ease-out">
               
            <!-- Icon dot on the left line -->
            <div class="absolute left-8 md:left-12 flex h-10 w-10 md:h-12 md:w-12 -translate-x-1/2 items-center justify-center rounded-full border-[3px] bg-bg-dark z-10"
                 [ngClass]="experience.iconClass">
               <lucide-icon [name]="experience.icon" class="h-4 w-4 md:h-5 md:w-5"></lucide-icon>
            </div>

            <!-- Card -->
            <article class="w-[calc(100%-5.5rem)] md:w-[calc(100%-7rem)] relative rounded-2xl border border-border/40 bg-bg-light/40 shadow-xl backdrop-blur-sm p-6 sm:p-8 overflow-hidden group">
              <!-- Top colored border -->
              <div class="absolute left-0 top-0 h-1 w-full" [ngClass]="experience.colorClass"></div>
              
              <div class="flex flex-col gap-4">
                <!-- Header of card -->
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                  <div class="order-2 sm:order-1">
                    <h3 class="text-xl font-bold text-text">{{ experience.title }}</h3>
                    <div class="mt-2 flex items-center gap-2 text-xs font-medium text-text-muted">
                      <lucide-icon name="building-2" class="h-3.5 w-3.5"></lucide-icon>
                      <span>{{ experience.company }}</span>
                    </div>
                  </div>
                  <!-- Period badge -->
                  <div class="order-1 sm:order-2 self-start rounded-full border border-border/60 bg-bg-dark/50 px-3 py-1 text-[0.65rem] font-medium text-text-muted/80 whitespace-nowrap">
                    {{ experience.period }}
                  </div>
                </div>

                <!-- Description -->
                <p class="mt-2 text-[0.85rem] leading-relaxed text-text-muted/90">
                  {{ experience.summary }}
                </p>

                <!-- Achievements -->
                <div class="mt-2">
                  <h4 class="text-xs font-semibold text-text uppercase tracking-wider mb-2">{{ texts().achievementsLabel }}</h4>
                  <ul class="space-y-2 text-[0.8rem] leading-relaxed text-text-muted/90">
                    <li *ngFor="let achievement of experience.achievements" class="flex gap-2">
                      <span class="mt-1.5 h-1 w-1 shrink-0 rounded-full bg-primary/70"></span>
                      <span>{{ achievement }}</span>
                    </li>
                  </ul>
                </div>

                <!-- Technologies -->
                <div class="mt-4 flex flex-wrap gap-2">
                  <span *ngFor="let tech of experience.technologies"
                    class="rounded border border-border/40 bg-bg-dark/40 px-3 py-1 text-[0.65rem] font-medium text-text-muted transition-colors group-hover:border-border/80">
                    {{ tech }}
                  </span>
                </div>
              </div>
            </article>
            
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</section>
