<section id="skills" class="relative isolate overflow-hidden bg-bg-dark py-16 sm:py-20 rounded-2xl shadow-lg shadow-black/20 border border-border/20 mt-8">

  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-10">
    <header class="text-center">
      <h2 class="text-3xl font-semibold tracking-wide text-text sm:text-4xl">{{ title }}</h2>
      <p class="mx-auto mt-3 max-w-2xl text-sm leading-relaxed text-text-muted sm:text-base">
        {{ subtitle }}
      </p>
    </header>

    <div class="mt-12 grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      <article
        *ngFor="let category of categories"
        class="rounded-2xl border border-border/80 bg-bg-light/45 p-6 shadow-[0_18px_45px_rgba(0,0,0,0.2)] backdrop-blur-sm"
      >
        <div class="flex items-center gap-3">
          <div
            class="grid h-10 w-10 place-items-center rounded-xl text-white shadow-[0_10px_24px_rgba(0,0,0,0.35)]"
            [ngClass]="category.accentClass"
          >
            <lucide-icon [name]="category.icon" class="h-5 w-5" aria-hidden="true"></lucide-icon>
          </div>
          <h3 class="text-lg font-semibold text-text">{{ category.title }}</h3>
        </div>

        <div class="mt-4 flex flex-wrap gap-2">
          <span
            *ngFor="let item of category.items"
            class="rounded-full bg-bg-dark/70 px-3 py-1 text-[0.72rem] font-medium text-text-muted ring-1 ring-inset ring-border-muted"
          >
            {{ item }}
          </span>
        </div>
      </article>
    </div>
  </div>
</section>
