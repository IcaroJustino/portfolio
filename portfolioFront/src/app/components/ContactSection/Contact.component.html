<section id="contact" class="relative isolate overflow-hidden bg-bg-dark py-16 sm:py-20 rounded-2xl shadow-lg shadow-black/20 border border-border/20 mt-8">

  
  <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
    <header class="text-center mb-16">
      <h2 class="text-3xl font-semibold tracking-wide text-text sm:text-4xl">{{ texts().title }}</h2>
      <p class="mx-auto mt-3 max-w-2xl text-sm leading-relaxed text-text-muted sm:text-base">
        {{ texts().subtitle }}
      </p>
    </header>

    <div class="grid gap-12 lg:grid-cols-2 lg:gap-16">
      
      <!-- Left Column: Contact Info -->
      <div>
        <h3 class="text-2xl font-bold text-text mb-4">{{ texts().connectTitle }}</h3>
        <p class="text-sm leading-relaxed text-text-muted mb-8">
          {{ texts().connectText }}
        </p>

        <div class="space-y-6">
          <div *ngFor="let info of contactInfo()" class="flex items-center gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary/20 text-primary ring-1 ring-inset ring-primary/30">
              <lucide-icon [name]="info.icon" class="h-5 w-5"></lucide-icon>
            </div>
            <div>
              <p class="text-sm font-bold text-text">{{ info.title }}</p>
              <p class="text-sm text-text-muted">{{ info.value }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Contact Form -->
      <div class="rounded-2xl border border-border/80 bg-bg-light/40 p-6 sm:p-8 shadow-lg backdrop-blur-sm">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-5">
          
          <!-- Honeypot (invisible to humans, bots auto-fill it) -->
          <div style="position: absolute; left: -9999px; opacity: 0; height: 0; overflow: hidden;" aria-hidden="true">
            <label for="website">Website</label>
            <input 
              type="text" 
              id="website" 
              name="website" 
              [(ngModel)]="honeypot"
              tabindex="-1"
              autocomplete="off"
            >
          </div>

          <div>
            <label for="name" class="block text-xs font-medium text-text-muted mb-1.5">{{ texts().form.name }}</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              [ngModel]="formData().name"
              (ngModelChange)="formData.set({name: $event, email: formData().email, message: formData().message})"
              required
              maxlength="100"
              class="w-full rounded-lg border border-border/80 bg-bg-dark/50 px-4 py-3 text-sm text-text placeholder-text-muted/50 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition"
              [placeholder]="texts().form.namePlaceholder"
            >
          </div>
          
          <div>
            <label for="email" class="block text-xs font-medium text-text-muted mb-1.5">{{ texts().form.email }}</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              [ngModel]="formData().email"
              (ngModelChange)="formData.set({name: formData().name, email: $event, message: formData().message})"
              required
              maxlength="254"
              class="w-full rounded-lg border border-border/80 bg-bg-dark/50 px-4 py-3 text-sm text-text placeholder-text-muted/50 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition"
              [placeholder]="texts().form.emailPlaceholder"
            >
          </div>
          
          <div>
            <label for="message" class="block text-xs font-medium text-text-muted mb-1.5">{{ texts().form.message }}</label>
            <textarea 
              id="message" 
              name="message" 
              rows="4" 
              [ngModel]="formData().message"
              (ngModelChange)="formData.set({name: formData().name, email: formData().email, message: $event})"
              required
              maxlength="2000"
              class="w-full rounded-lg border border-border/80 bg-bg-dark/50 px-4 py-3 text-sm text-text placeholder-text-muted/50 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition resize-y"
              [placeholder]="texts().form.messagePlaceholder"
            ></textarea>
            <p class="mt-1 text-right text-xs text-text-muted/50">
              {{ formData().message.length }} / 2000
            </p>
          </div>
          
          <!-- Submit Button -->
          <button 
            type="submit" 
            [disabled]="isSubmitting() || hasSubmitted()"
            class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 px-5 py-3.5 text-sm font-semibold text-white transition hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <!-- Default state -->
            <ng-container *ngIf="!isSubmitting() && !hasSubmitted()">
              <lucide-icon name="send" class="h-4 w-4"></lucide-icon>
              {{ texts().form.sendBtn }}
            </ng-container>

            <!-- Sending spinner -->
            <ng-container *ngIf="isSubmitting()">
              <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              {{ texts().form.sendingBtn }}
            </ng-container>

            <!-- Blocked state after success -->
            <ng-container *ngIf="hasSubmitted()">
              <lucide-icon name="check-circle" class="h-4 w-4"></lucide-icon>
              Enviado
            </ng-container>
          </button>
        </form>
      </div>

    </div>
  </div>

</section>
