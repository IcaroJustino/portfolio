<header class="sticky top-0 z-[2147483646] border-b border-border bg-gradient-to-r from-bg-dark via-bg to-bg-dark/70 backdrop-blur">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-5">
    <a class="text-lg font-semibold tracking-wide text-text cursor-pointer" (click)="scrollToSection('#home')">Portfolio</a>

    <div class="flex items-center gap-6">
      <nav class="hidden items-center gap-6 text-sm font-medium text-text-muted md:flex">
        <a
          *ngFor="let item of navItems()"
          class="cursor-pointer transition-colors hover:text-text"
          (click)="scrollToSection(item.href)"
        >
          {{ item.label }}
        </a>
      </nav>

      <div class="flex items-center gap-3">
        <button
          class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-border bg-bg-light/60 text-sm font-bold text-text transition hover:bg-highlight"
          type="button"
          aria-label="Toggle language"
          (click)="toggleLanguage()"
        >
          {{ languageService.currentLang() === 'eng-us' ? 'EN' : 'PT' }}
        </button>

        <button
          class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-border bg-bg-light/60 text-text transition hover:bg-highlight"
          type="button"
          aria-label="Toggle theme"
          (click)="toggleTheme()"
        >
          <lucide-icon [name]="isDarkMode ? 'sun' : 'moon'" class="h-5 w-5" aria-hidden="true"></lucide-icon>
        </button>

        <button
          class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-border bg-bg-light/60 text-text transition hover:bg-highlight md:hidden"
          type="button"
          aria-label="Open menu"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="isMenuOpen"
          (click)="toggleMenu()"
        >
          <lucide-icon name="menu" class="h-5 w-5" aria-hidden="true"></lucide-icon>
        </button>
      </div>
    </div>
  </div>

</header>

<div
  class="fixed top-0 left-0 right-0 z-[2147483647] cursor-default bg-bg/95 transition-all duration-300 ease-out md:hidden"
  [class.opacity-0]="!isMenuOpen"
  [class.opacity-100]="isMenuOpen"
  [class.-translate-y-full]="!isMenuOpen"
  [class.translate-y-0]="isMenuOpen"
  [class.pointer-events-none]="!isMenuOpen"
>
  <div class="flex flex-col">
    <div class="flex items-center justify-end border-b border-border bg-bg/90 px-6 py-5 backdrop-blur">
      <button
        class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-border text-text transition hover:bg-highlight ="
        type="button"
        aria-label="Close menu"
        (click)="closeMenu()"
      >
        <lucide-icon name="x" class="h-5 w-5" aria-hidden="true"></lucide-icon>
      </button>
    </div>

    <div class="overflow-y-auto px-6 py-6">
      <div class="rounded-2xl border border-border bg-bg-light/70 p-4 shadow-2xl">
        <nav class="flex flex-col gap-4 text-lg font-medium text-text">
          <a
            *ngFor="let item of navItems()"
            class="cursor-pointer rounded-lg px-2 py-1 transition-colors hover:text-primary"
            (click)="scrollToSection(item.href); closeMenu()"
          >
            {{ item.label }}
          </a>
        </nav>
      </div>
    </div>
  </div>
</div>
